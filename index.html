<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033}
.app{max-width:760px;margin:auto;padding:18px}.title{font-size:28px;font-weight:800}.sub{color:#6b7280;margin-bottom:16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:13px}.label{font-size:12px;color:#6b7280}.num{font-size:20px;font-weight:800;margin-top:4px}.green{color:#16a34a}.red{color:#dc2626}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{width:100%;height:46px;border-radius:11px;border:1px solid #dbe0e8;padding:8px 12px;font-size:16px;background:#fff}button{font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}
.month{display:flex;align-items:center;justify-content:space-between}.month button{width:46px}.day{background:#f8fafc;border:1px solid #e5e7eb;border-radius:13px;padding:12px;margin:9px 0}.dayhead{display:flex;justify-content:space-between;font-weight:750}.tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e5e7eb}.tx:last-child{border:0}.muted{color:#6b7280;font-size:13px}
.bar{display:grid;grid-template-columns:60px 1fr 80px;gap:8px;align-items:center;margin:9px 0;font-size:12px}.barbg{height:16px;background:#dbeafe;border-radius:20px;overflow:hidden}.barfill{height:100%;background:#2563eb}
@media(max-width:520px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}.app{padding:12px}.card{padding:14px}}
</style>
</head>
<body>
<div class="app">
<div class="title">💰 Money Tracker</div><div class="sub">Income, expenses and monthly summary</div>
<div class="card"><div class="grid">
<div class="stat"><div class="label">BALANCE</div><div id="balance" class="num">₹0</div></div>
<div class="stat"><div class="label">TOTAL INCOME</div><div id="income" class="num green">₹0</div></div>
<div class="stat"><div class="label">TOTAL EXPENSE</div><div id="expense" class="num red">₹0</div></div>
</div></div>

<div class="card"><h3>Add Transaction</h3>
<form id="form">
<div class="formgrid"><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select><input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount ₹" required></div><br>
<div class="formgrid"><select id="category"><option>Food</option><option>Fuel</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Rent</option><option>Entertainment</option><option>Health</option><option>Salary</option><option>Other</option></select><input id="date" type="date" required></div><br>
<input id="note" placeholder="Note (optional)"><br><br><button class="primary">+ Add Transaction</button>
</form><div id="msg" class="muted"></div></div>

<div class="card"><div class="month"><button id="prev">‹</button><div style="text-align:center"><b id="month"></b><div class="muted">Monthly summary</div></div><button id="next">›</button></div></div>

<div class="card"><h3>📅 Daily Breakdown</h3><div id="days"></div></div>
<div class="card"><h3>📊 Monthly Expense Chart</h3><div id="chart"></div></div>
<div class="card"><h3>🏁 Monthly Grand Total</h3><div class="grid">
<div class="stat"><div class="label">INCOME</div><div id="mi" class="num green">₹0</div></div>
<div class="stat"><div class="label">EXPENSE</div><div id="me" class="num red">₹0</div></div>
<div class="stat"><div class="label">NET</div><div id="mn" class="num">₹0</div></div>
</div></div>
<div class="card"><h3>🧾 Today's Transactions</h3><div id="today"></div><br><button id="clear">Clear all saved data</button></div>
</div>
<script>
const KEY="money_tracker_v1";let data=[];let view=new Date();
const $=id=>document.getElementById(id);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const iso=d=>new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())).toISOString().slice(0,10);
const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){
 let inc=0,exp=0;data.forEach(x=>x.type==="income"?inc+=x.amount:exp+=x.amount);
 $("income").textContent=money(inc);$("expense").textContent=money(exp);$("balance").textContent=money(inc-exp);
 $("month").textContent=view.toLocaleString("en-IN",{month:"long",year:"numeric"});
 let mk=view.getFullYear()+"-"+String(view.getMonth()+1).padStart(2,"0");
 let rows=data.filter(x=>x.date.startsWith(mk)).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
 let mi=0,me=0,groups={};rows.forEach(x=>{x.type==="income"?mi+=x.amount:me+=x.amount;(groups[x.date]??=[]).push(x)});
 $("mi").textContent=money(mi);$("me").textContent=money(me);$("mn").textContent=money(mi-me);
 let dates=Object.keys(groups).sort().reverse();
 $("days").innerHTML=dates.length?dates.map(d=>{let di=0,de=0;groups[d].forEach(x=>x.type==="income"?di+=x.amount:de+=x.amount);
 return `<div class="day"><div class="dayhead"><span>${new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}</span><span class="red">${money(de)}</span></div>`+
 groups[d].map(x=>`<div class="tx"><div><b>${esc(x.note||x.category)}</b><div class="muted">${esc(x.category)}</div></div><b class="${x.type==="income"?"green":"red"}">${x.type==="income"?"+":"-"}${money(x.amount)}</b></div>`).join("")+
 `<div class="muted" style="padding-top:8px">Daily income: <b class="green">${money(di)}</b> &nbsp; Net: <b>${money(di-de)}</b></div></div>`}).join(""):"<div class='muted'>No transactions this month.</div>";
 let vals=Object.entries(groups).map(([d,r])=>[d,r.reduce((s,x)=>s+(x.type==="expense"?x.amount:0),0)]).filter(x=>x[1]>0),max=Math.max(1,...vals.map(x=>x[1]));
 $("chart").innerHTML=vals.length?vals.map(x=>`<div class="bar"><span>${x[0].slice(8)}</span><div class="barbg"><div class="barfill" style="width:${x[1]/max*100}%"></div></div><b>${money(x[1])}</b></div>`).join(""):"<div class='muted'>No expenses for this month.</div>";
 let t=iso(new Date());let tr=data.filter(x=>x.date===t).sort((a,b)=>b.id-a.id);
 $("today").innerHTML=tr.length?tr.map(x=>`<div class="tx"><div><b>${esc(x.note||x.category)}</b><div class="muted">${esc(x.category)}</div></div><b class="${x.type==="income"?"green":"red"}">${x.type==="income"?"+":"-"}${money(x.amount)}</b></div>`).join(""):"<div class='muted'>No transactions today.</div>";
}
$("form").addEventListener("submit",e=>{e.preventDefault();let a=Number($("amount").value);if(!a||a<0){$("msg").textContent="Enter a valid amount.";return}data.push({id:Date.now(),type:$("type").value,amount:a,category:$("category").value,date:$("date").value,note:$("note").value.trim()});save();$("amount").value="";$("note").value="";$("msg").textContent="Saved ✓";render();setTimeout(()=>$("msg").textContent="",1200)});
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};$("next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$("clear").onclick=()=>{if(confirm("Delete all saved data?")){data=[];save();render()}};
$("date").value=iso(new Date());load();render();
</script>
</body>
</html>
